<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>

    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>amCharts examples</title>
        <script src="../amcharts/amcharts.js" type="text/javascript"></script>
        <script src="../amcharts/serial.js" type="text/javascript"></script>

        <script>
            var chart;

            var chartData = [
                {
                    "mapel": "PAI",
                    "nilai": 9,
                    "kkm": 8
                },
                {
                    "mapel": "PKN",
                    "nilai": 8,
                    "kkm": 7
                },
                {
                    "mapel": "BI",
                    "nilai": 8,
                    "kkm": 7
                },
                {
                    "mapel": "B.Ing",
                    "nilai": 7,
                    "kkm": 8
                },
                {
                    "mapel": "MTK",
                    "nilai": 8,
                    "kkm": 7.5
                },
                {
                    "mapel": "IPA",
                    "nilai": 7.5,
                    "kkm": 8.0
                },
                {
                    "mapel": "IPS",
                    "nilai": 8,
                    "kkm": 7.5
                },
                {
                    "mapel": "Kesenian",
                    "nilai": 9,
                    "kkm": 8
                },
                {
                    "mapel": "Penjas",
                    "nilai": 8,
                    "kkm": 8
                }
            ];


            AmCharts.ready(function () {
                // SERIAL CHART
                chart = new AmCharts.AmSerialChart();
                chart.dataProvider = chartData;
                chart.categoryField = "mapel";
                chart.color = "#000000";
                chart.fontSize = 14;
                chart.startDuration = 1;
                chart.plotAreaFillAlphas = 0.2;
                // the following two lines makes chart 3D
                chart.angle = 30;
                chart.depth3D = 25;

                // AXES
                // category
                var categoryAxis = chart.categoryAxis;
                categoryAxis.gridAlpha = 0.2;
                categoryAxis.gridPosition = "start";
                categoryAxis.gridColor = "#000000";
                categoryAxis.axisColor = "#000000";
                categoryAxis.axisAlpha = 0.5;
                categoryAxis.dashLength = 5;

                // value
                var valueAxis = new AmCharts.ValueAxis();
                valueAxis.stackType = "3d"; // This line makes chart 3D stacked (columns are placed one behind another)
                valueAxis.gridAlpha = 0.2;
                valueAxis.gridColor = "#000000";
                valueAxis.axisColor = "#000000";
                valueAxis.axisAlpha = 0.5;
                valueAxis.dashLength = 5;
                valueAxis.title = "Grafik Nilai Akademik";
                valueAxis.titleColor = "#000000";
                valueAxis.unit = "%";
                chart.addValueAxis(valueAxis);

                // GRAPHS
                // first graph
                var graph1 = new AmCharts.AmGraph();
                graph1.title = "2004";
                graph1.valueField = "nilai";
                graph1.type = "column";
                graph1.lineAlpha = 0;
                graph1.lineColor = "#D2CB00";
                graph1.fillAlphas = 1;
                graph1.balloonText = "Nilai Mapel [[category]] : <b>[[value]]</b>";
                chart.addGraph(graph1);

                // second graph
                var graph2 = new AmCharts.AmGraph();
                graph2.title = "2005";
                graph2.valueField = "kkm";
                graph2.type = "column";
                graph2.lineAlpha = 0;
                graph2.lineColor = "#BEDF66";
                graph2.fillAlphas = 1;
                graph2.balloonText = "Nilai KKM Mapel [[category]] : <b>[[value]]</b>";
                chart.addGraph(graph2);

                chart.write("chartdiv");
            });
        </script>
    </head>

    <body>
        <div id="chartdiv" style="width: 100%; height: 400px;"></div>
    </body>

</html>
